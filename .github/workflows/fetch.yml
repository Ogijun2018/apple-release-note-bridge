name: fetch-apple-release-notes
on:
  schedule:
    - cron: "30 15 * * *" # UTC 15:30 = JST 00:30
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i
      - run: npx playwright install --with-deps chromium
      - run: npm run fetch
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "update bridge" || echo "no changes"
          git push

